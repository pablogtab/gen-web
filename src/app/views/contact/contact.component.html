<article>
  <h1>Contáctanos</h1>
  <img src="assets/contact-background.png" alt="background" class="background-1" />
</article>

<section class="contact">
  <h1>¡Conéctate con nosotros!</h1>
  <div class="contact-card">
    <div class="info">
      <div class="background">
        <img src="assets/contact-background-2.png" alt="" />
      </div>
      <div class="info-container">
        <div class="row">
          <div (click)="navigateTo('mailto:info@genprojectusa.com')" class="icon">
            <img src="assets/icon-envelope.png" alt="" />
          </div>
          <p>info&#64;genprojectusa.com</p>
        </div>
        <div class="row">
          <div (click)="navigateTo('https://api.whatsapp.com/send/?phone=13053339446&text&type=phone_number&app_absent=0')" class="icon">
            <img src="assets/icon-phone-call.png" alt="" />
          </div>
          <p>
            <span class="title">PHONE NUMBER</span>
            <br />
            +1 305 333-9446
          </p>
        </div>
        <div class="row">
          <div (click)="navigateTo('https://maps.app.goo.gl/dB88EztEFBKL8J9B9')" class="icon">
            <img src="assets/icon-map-pin.png" alt="" />
          </div>
          <p style="max-width: 50%;">
            <span class="title">HEAD OFFICE</span>
            <br />
            2700, Glades Circle, Suite 107, Weston FL 33327 Estados Unidos
          </p>
        </div>
      </div>
    </div>
    <!-- <a href="mailto:pablo.g.taborda@gmail.com?subject=Subject&body=message"
            >Enviar</a
            > -->

    <div class="form">
      <div class="group">
        <div class="input-form">
          <span>Nombre</span>
          <input type="text" />
        </div>
        <div class="input-form">
          <span>Email</span>
          <input type="email" />
        </div>
      </div>

      <div class="group">
        <div class="input-form">
          <span>Asunto</span>
          <input [(ngModel)]="subject" type="text" />
        </div>
      </div>
      <div class="group" style="flex: 3">
        <div class="input-form">
          <span>Mensaje</span>
          <textarea [(ngModel)]="message" style="resize: none" type="text"></textarea>
        </div>
      </div>
      <div class="group">
        <a href="mailto:{{ email }}?subject={{ subject }}&body={{ message }}">Enviar Mensaje <img
            src="assets/icon-arrow.png" /></a>
      </div>
    </div>
  </div>
</section>

<app-newsletter-form></app-newsletter-form>
