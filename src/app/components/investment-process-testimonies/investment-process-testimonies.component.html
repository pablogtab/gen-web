<div class="container">
  <div class="background">
    <img src="assets/home-waves-2.png" alt="" />
  </div>
  <h1>7 Pasos para comenzar tu proceso de inversión</h1>
  <div class="steps">
    <div class="step">
      <span>1</span>
      <p>Entrevista y asesoramiento</p>
      <img src="assets/step-arrow.svg" alt="" />
    </div>
    <div class="step end">
      <span>2</span>
      <p>Presentación de las propuestas</p>
      <img src="assets/step-arrow.svg" alt="" />
    </div>
    <div class="step">
      <span>3</span>
      <p>Estructuración de la cartera</p>
      <img src="assets/step-arrow.svg" alt="" />
    </div>
    <div class="step end">
      <span>4</span>
      <p>Creación de las estructuras legales</p>
      <img src="assets/step-arrow.svg" alt="" />
    </div>
    <div class="step">
      <span>5</span>
      <p>Apertura de cuentas bancarias</p>
      <img src="assets/step-arrow.svg" alt="" />
    </div>
    <div class="step end">
      <span>6</span>
      <p>Firma de <br />contratos</p>
      <img src="assets/step-arrow.svg" alt="" />
    </div>
    <div class="step">
      <span>7</span>
      <p>Monitoreo de retornos</p>
    </div>
  </div>
